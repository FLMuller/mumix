<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="generator" content="runbench">
<title>{{TITLE}}</title>
<style>
{{css}}</style>
<style>
{{rolecss}}</style>
<style>
{{benchcss}}
.bpanel[hidden]{display:none}
</style>
</head>
<body>
<h1>{{TITLE}}</h1>
<div class="bbar">{{TABBAR}}</div>
{{_\main/_}}
<script>
// a click on a tab, or on a link that has a data-go, shows that panel of the run and hides the others
document.addEventListener('click', function(event){
  var go = event.target.getAttribute ? event.target.getAttribute('data-go') : null;
  if (!go) return;
  var buttons = document.querySelectorAll('.btab'), panels = document.querySelectorAll('.bpanel');
  for (var i = 0; i < buttons.length; i++) {
    if (buttons[i].getAttribute('data-go')) {
      if (buttons[i].getAttribute('data-go') === go) buttons[i].classList.add('on'); else buttons[i].classList.remove('on');
    }
  }
  for (var j = 0; j < panels.length; j++) {
    if (panels[j].getAttribute('data-group') === 'run') panels[j].hidden = panels[j].id !== go;
  }
});
</script>
<script>
{{benchjs}}</script>
</body>
</html>
