<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Colour editor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fffaf5;--ink:#3a2a1c;--acc:#b34700;--line:#eedcd0;--card:#fff}
*{box-sizing:border-box}
body{margin:0;font:13px Verdana,sans-serif;color:var(--ink);background:var(--bg)}
header{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:8px 14px;
  background:#fff;border-bottom:2px solid var(--acc);position:sticky;top:0;z-index:5}
header h1{font-size:15px;margin:0 8px 0 0;color:var(--acc)}
header label{display:flex;gap:5px;align-items:center}
button,select,input[type=number]{font:inherit;padding:2px 8px;border:1px solid #c9b8a8;
  background:#fff;border-radius:3px;color:var(--ink)}
button{cursor:pointer}button:hover{background:#fdebd0}
main{display:grid;grid-template-columns:minmax(560px,46%) 1fr;gap:12px;padding:12px 14px}
@media(max-width:1000px){main{grid-template-columns:1fr}}
#rules{overflow:auto;max-height:calc(100vh - 70px);background:var(--card);
  border:1px solid var(--line);border-radius:4px}
#rules h2{margin:0;padding:6px 10px;font-size:13px;background:var(--acc);color:#fff;
  position:sticky;top:0;z-index:2}
table{border-collapse:collapse;width:100%}
th{text-align:left;font-weight:600;padding:3px 6px;background:#fdebd0;font-size:11px;
  position:sticky;top:29px;z-index:1}
td{padding:2px 6px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
#rules tr[data-r]:nth-child(even) td{background:#f3e5d8}
#rules tr[data-r]:nth-child(odd) td{background:#fff}
#rules tr[data-r]:hover td{background:#ffe9b8}
#rules tr[data-r].sel td{background:#ffd966}
#rules tr[data-r].sel td:first-child{box-shadow:inset 4px 0 0 #d35400;font-weight:700}
.mono{font-family:'JetBrains Mono',Consolas,monospace}
.sample{font-size:13px;padding:0 3px}
.box{position:relative;display:inline-block;width:26px;height:20px;border:1px solid #888;
  border-radius:3px;vertical-align:middle;overflow:hidden;cursor:pointer;
  background:repeating-conic-gradient(#ddd 0 25%,#fff 0 50%) 0 0/8px 8px}
.box .sw{position:absolute;inset:0}
.box input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;border:0;padding:0}
.x{padding:0 4px;margin-left:2px;font-size:11px;line-height:16px}
input[type=range]{width:84px;vertical-align:middle}
.w{display:inline-block;width:24px;text-align:right;color:#888;font-size:11px}
.pal{padding:0 4px;margin-left:2px;font-size:10px;line-height:16px}
#pane{display:flex;flex-direction:column;min-width:0}
#tabs{display:flex;gap:2px}
#tabs button{border-radius:4px 4px 0 0;border-bottom:0;background:#f4e6d8}
#tabs button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
#wrap{overflow:auto;max-height:calc(100vh - 110px);border:1px solid var(--line);display:flex;align-items:flex-start}
#wrap>pre{flex:none}
#wrap>#code{flex:1 0 auto}
#gut,#code{margin:0;padding:8px 6px;font:13px/1.45 'JetBrains Mono',Consolas,monospace;
  tab-size:4;white-space:pre}
#gut{color:#999;text-align:right;background:#f3ede6;user-select:none;position:sticky;left:0}
#code{flex:1;min-width:max-content}
#code span{cursor:pointer}
#code .L{display:block;margin:0 -6px -1px;padding:0 6px 1px}
#pop{position:fixed;display:none;z-index:20;background:#fff;border:1px solid #888;border-radius:4px;
  padding:8px;box-shadow:0 4px 18px rgba(0,0,0,.25);max-width:420px;max-height:70vh;overflow:auto}
#pop h4{margin:6px 0 3px;font-size:11px;color:#888;font-weight:600}
#pop .g{display:flex;flex-wrap:wrap;gap:2px}
#pop .c{width:20px;height:20px;border:1px solid #aaa;cursor:pointer;border-radius:2px}
#pop .c:hover{outline:2px solid #000}
#pop .c.sel{outline:2px solid #d35400;outline-offset:1px}
#pop .cur{padding-bottom:6px;border-bottom:1px solid var(--line);margin-bottom:4px}
#pop .tg{display:inline-block;padding:2px 6px;border:1px solid #ccc;border-radius:3px;cursor:pointer}
#pop .tg.on{border-color:#d35400;background:#fdebd0}
#pop .tg .c{display:inline-block;vertical-align:middle;cursor:pointer;
  background:repeating-conic-gradient(#ddd 0 25%,#fff 0 50%) 0 0/8px 8px}
small{color:#999}
.where{flex-basis:100%;font:12px 'JetBrains Mono',Consolas,monospace;color:#555;word-break:break-all}
.where b{color:var(--acc);font-family:Verdana,sans-serif}.where .warn{color:#c00;font-weight:700}
</style></head><body>
<header>
  <h1>Colour editor</h1>
  <label>Vision <select id="vision">
    <option value="none">normal</option><option value="protanopia">protanopia (no red)</option>
    <option value="deuteranopia">deuteranopia (no green)</option>
    <option value="tritanopia">tritanopia (no blue)</option>
    <option value="monochrome">monochrome</option></select></label>
  <label>Palette sort <select id="sort"><option value="color">colour (hue, chroma, lightness)</option>
    <option value="intensity">intensity (lightness, chroma, hue)</option>
    <option value="none">as listed</option></select></label>
  <label>Page <span class="box"><span class="sw" id="pagesw"></span><input type="color" id="pagebg"></span></label>
  <label>Size <input type="number" id="size" min="8" max="30" value="13" style="width:54px"></label>
  <button id="savedir" title="choose a folder: python.mu and cython.mu are written into it">Save .mu files to folder</button><button id="loaddir" title="choose a folder holding python.mu and cython.mu">Load .mu files from folder</button><button id="undo" title="back to the last loaded or saved rules">Undo unsaved changes</button>
  <small id="msg"></small>
  <div id="where" class="where"></div>
</header>
<main>
  <section id="rules"></section>
  <section id="pane">
    <div id="tabs"><button data-t="py" class="on">Python</button><button data-t="pyx">Cython</button></div>
    <div id="wrap"><pre id="gut"></pre><pre id="code"></pre></div>
  </section>
</main>
<div id="pop"></div>

function defaults(){const r={};for(const k in DEF){const d=DEF[k];

/* ---------- colour maths (after pico.m) ---------- */
const HPE=[[.31399022,.63951294,.04649755],[.15537241,.75789446,.08670142],[.01775239,.10944209,.87256922]];
const HPEI=[[5.47221206,-4.6419601,.16963708],[-1.1252419,2.29317094,-.1678952],[.02980165,-.19318073,1.16364789]];
const SIM={protanopia:[[0,1.05118294,-.05116099],[0,1,0],[0,0,1]],
 deuteranopia:[[1,0,0],[.9513092,0,.04866992],[0,0,1]],tritanopia:[[1,0,0],[0,1,0],[-.86744736,1.86727089,0]]};
const mul=(M,v)=>M.map(r=>r[0]*v[0]+r[1]*v[1]+r[2]*v[2]);
const lin=c=>c<=.04045?c/12.92:Math.pow((c+.055)/1.055,2.4);
const gam=c=>{c=c<=.0031308?c*12.92:Math.pow(c,1/2.4)*1.055-.055;return Math.min(1,Math.max(0,c));};
const h2v=h=>{h=h.replace('#','');return [0,2,4].map(i=>parseInt(h.substr(i,2),16)/255);};
const v2h=v=>'#'+v.map(c=>Math.round(c*255).toString(16).padStart(2,'0')).join('').toUpperCase();
function sim(hex){
  if(!hex||S.vision==='none')return hex;
  const l=h2v(hex).map(lin);
  if(S.vision==='monochrome'){const y=gam(.2126*l[0]+.7152*l[1]+.0722*l[2]);return v2h([y,y,y]);}
  return v2h(mul(HPEI,mul(SIM[S.vision],mul(HPE,l))).map(gam));
}
const XYZM=[[.4124564,.3575761,.1804375],[.2126729,.7151522,.072175],[.0193339,.119192,.9503041]];
function lch(hex){ /* rgb -> xyz -> Lab -> LCh as pico does */
  const x=mul(XYZM,h2v(hex).map(lin)).map((v,i)=>v/[.95047,1,1.08883][i]);
  const f=x.map(t=>t>Math.pow(6/29,3)?Math.cbrt(t):t*Math.pow(29/6,2)/3+4/29);
  const L=116*f[1]-16,a=500*(f[0]-f[1]),b=200*(f[1]-f[2]);
  return [L,Math.hypot(a,b),(Math.atan2(b,a)*180/Math.PI+360)%360];}
function sorted(list){
  if(S.sort==='none')return list;
  const k=list.map(c=>({c,v:lch(c.hex)}));
  const [a,b,d]=S.sort==='color'?[2,1,0]:[0,1,2]; /* hCL or LCh */
  k.sort((p,q)=>p.v[a]-q.v[a]||p.v[b]-q.v[b]||p.v[d]-q.v[d]);
  return k.map(e=>e.c);}

function showCode(){
  if(!TOK[TAB])TOK[TAB]=tokenize(CODE[TAB],TAB==='pyx');
  const L=TOK[TAB];let g='',c='';
  for(let k=0;k<L.length;k++){g+=(k+1)+'\n';
    const lead=L[k].find(x=>!(x[0]==='default'&&/^\s*$/.test(x[1])));
    /* a comment-only line or a docstring line: one band, left to right */
    const whole=lead&&(lead[0]==='lcomment'||lead[0]==='fileline'||(lead[0]==='docstring'&&L[k].every(x=>x[0]==='docstring'||
      (x[0]==='default'&&/^\s*$/.test(x[1])))));
    let row='';
    for(const [r,t] of L[k])row+=`<span class="r-${r}" data-r="${r}">${esc(t)}</span>`;
    if(!L[k].some(x=>x[1]))row+='&#8203;';
    c+=whole?`<span class="L r-${lead[0]}" data-r="${lead[0]}">${row}</span>`:row+'\n';}
  $('gut').textContent=g;$('code').innerHTML=c;
}
function popup(btn,tr,target){
  const p=$('pop');let h='';
  for(const [name,items] of PAL){
    const list=items.map(it=>{
      if(typeof it==='string')return {hex:'#'+it.toUpperCase(),n:'#'+it};
      if(Array.isArray(it)&&typeof it[0]==='number')return {hex:v2h(it.map(x=>x/255)),n:it.join(',')};
      if(typeof it[1]==='number')return {hex:v2h(it.slice(1).map(x=>x/255)),n:it[0]};
      return {hex:'#'+it[1],n:it[0]};});
    h+=`<h4>${name}</h4><div class="g">`+sorted(list).map(c=>
      `<span class="c" data-h="${c.hex}" title="${esc(c.n)} ${c.hex}" style="background:${sim(c.hex)}"></span>`).join('')+'</div>';}
  const lab=ROLES.find(x=>x.id===tr.dataset.r).label;
  h=`<div class="cur"><b>${esc(lab)}</b> &nbsp; set: `+
    `<span class="tg" data-t="fg">text <span class="c" id="curfg"></span></span> `+
    `<span class="tg" data-t="bg">back <span class="c" id="curbg"></span></span> `+
    `<button class="x" data-k="nobg2">no back</button></div>`+h;
  p.innerHTML=h;p.dataset.r=tr.dataset.r;p.dataset.target=target||'fg';popMark();p.style.display='block';
  const b=btn.getBoundingClientRect();
  p.style.left=Math.max(4,Math.min(innerWidth-p.offsetWidth-8,b.left-p.offsetWidth+30))+'px';
  p.style.top=Math.min(innerHeight-p.offsetHeight-8,b.bottom+4)+'px';
}

function popMark(){ /* show the rule's current text and back colours; outline the one being set */
  const p=$('pop'),v=S.roles[p.dataset.r],tg=p.dataset.target,cur=v[tg];
  $('curfg').style.background=sim(v.fg);
  $('curbg').style.background=v.bg?sim(v.bg):'transparent';

function parseMu(text,d){
  let head=null,n=0;
  const pg=/Page background (#[0-9A-Fa-f]{6}), font size (\d+)px/.exec(text);
  if(pg){d.bg=pg[1].toUpperCase();d.size=+pg[2];}
  for(const line of text.split('\n')){
    if(!line.startsWith('|')){head=null;continue;}
    const cells=line.trim().replace(/^\||\|$/g,'').split('|').map(c=>c.trim());
    if(/^:?-+/.test(cells[0]))continue;
    if(!head){head=cells.map(c=>c.toLowerCase());continue;}
    const col=k=>cells[head.indexOf(k)];
    const key=(col('id')||col('role')||'').replace(/`/g,'');
    const r=ROLES.find(x=>x.id===key||x.label===key);
    if(!r||head.indexOf('colour')<0)continue;
    const hex=h=>/^#[0-9A-Fa-f]{6}$/.test(h||'')?h.toUpperCase():'';
    const v=d.roles[r.id];
    v.fg=hex(col('colour'))||v.fg;v.bg=hex(col('back'));
    v.w=Math.min(800,Math.max(100,+col('weight')||v.w));
    v.i=/^y/i.test(col('italic')||'');v.u=/^y/i.test(col('underline')||'');n++;}
  return n;
}

function fromTexts(){ /* the settings the rule files describe */
  const d=defaults();parseMu(LANGTXT.py,d);parseMu(LANGTXT.pyx,d);
  return Object.assign(d,{vision:S.vision,sort:S.sort});}
function langText(g){ /* the file as it was, with only the page line, the date and the Rules table replaced */
  const t=LANGTXT[g],i=t.indexOf('## Rules');
  const head=t.slice(0,i).replace(/Page background #[0-9A-Fa-f]{6}, font size \d+px\./,
      `Page background ${S.bg}, font size ${S.size}px.`)
    .replace(/saved from it \([^)]*\)/,`saved from it (${new Date().toISOString().slice(0,10)})`);
  let r='## Rules\n\n| Role | Id | Matches | Colour | Back | Weight | Italic | Underline |\n'+
        '|:--|:--|:--|:--|:--|:--|:--|:--|\n';
  for(const x of ROLES.filter(x=>x.g===g)){const v=S.roles[x.id];
    r+=`| ${x.label} | ${x.id} | \`${x.ex}\` | ${v.fg} | ${v.bg||'-'} | ${v.w} | ${v.i?'yes':'no'} | ${v.u?'yes':'no'} |\n`;}
  return head+r;
}

CODE.py="\"\"\"showcase.py -- one of every colour role, then real code below.\n\nThe module docstring is a docstring role; this paragraph too.\n\"\"\"\n# A comment line; TODO: check the marker, FIXME later, see https://example.com/page\nimport os\nimport re\nimport sys\nfrom collections import OrderedDict as Ordered\nfrom pathlib import Path, PurePath\n\n__all__ = ['Shape', 'area', 'parse']\nMAX_ITEMS = 0x1F + 1_000          # constants and numbers\nRATIO = 3.5e-3                    # float with exponent\nROOT = 2j * 4                     # complex number\nNAME = 'plain string'\nRAW = r'C:\\temp\\new'              # raw string keeps its backslashes\nBYTES = b'bytes\\x00\\xff'\nTEXT = \"double quoted with an escape \\n and a tab \\t\"\nFORMATTED = f'{NAME!r} has {len(NAME):>5} chars and {RATIO:.2e}'\nOLD = 'value %s of %d' % (NAME, 3)\nNOTE = '''a triple string\nover several lines, not a docstring'''\n\n\nclass Shape(Ordered):\n    \"\"\"A docstring on a class.\n\n    Second paragraph of the docstring, shown in the docstring colour.\n    \"\"\"\n\n    sides: int = 0\n\n    def __init__(self, name: str, sides: int = 4, *extra: float, **options) -> None:\n        \"\"\"Set up the shape: self is the dark orange.\"\"\"\n        super().__init__()\n        self.name = name\n        self.sides = sides\n        self.extra = list(extra)\n        self.options = dict(options)\n\n    @property\n    def label(self) -> str:\n        return f'{self.name}/{self.sides}'\n\n    @staticmethod\n    def unit(scale: float = 1.0) -> 'Shape':\n        return Shape('unit', 4, scale)\n\n    @classmethod\n    def square(cls, side: float) -> 'Shape':\n        shape = cls('square', 4, side)\n        shape.extra.append(side)\n        return shape\n\n    def __repr__(self):\n        return f'Shape({self.name!r}, {self.sides})'\n\n    def __eq__(self, other):\n        return isinstance(other, Shape) and self.sides == other.sides\n\n\nclass Circle(Shape):\n    \"\"\"A subclass: Shape in the bases is a class use.\"\"\"\n\n    def __init__(self, radius: float = 1.0) -> None:\n        super().__init__('circle', 0)\n        self.radius = radius\n\n    def grow(self, factor: float) -> 'Circle':\n        return Circle(self.radius * factor)\n\n\nunit = Circle()\nshapes: list[Shape] = [unit, Shape.square(2.0), Circle(3.0).grow(2)]\nbiggest = max(shapes, key=lambda item: isinstance(item, Circle) and item.radius)\n\n\ndef area(shape: Shape, scale: float = 1.0) -> float:\n    \"\"\"Return the area; a method call (.append) and an attribute (.extra) differ.\"\"\"\n    if not shape.extra:\n        raise ValueError('no extra values')\n    first, *rest = shape.extra\n    total = first * scale ** 2 + sum(rest) // 2 - 1 % 3\n    return total\n\n\ndef parse(text, default=None):\n    # Parse numbers; exceptions are red bold, builtins violet bold.\n    values = []\n    for index, word in enumerate(text.split()):\n        try:\n            values.append(int(word, 16) if word.startswith('0x') else float(word))\n        except (ValueError, OverflowError) as error:\n            print(f'bad word {index}: {word!r} ({error})', file=sys.stderr)\n        except KeyboardInterrupt:\n            raise\n        else:\n            continue\n        finally:\n            pass\n    if (count := len(values)) > 3 and default is not None or count == 0:\n        return default\n    return sorted(values, key=lambda value: -value)[:MAX_ITEMS]\n\n\ndef describe(item):\n    match item:\n        case Shape(sides=4):\n            return 'four sided'\n        case [first, second, *others] if first < second:\n            return 'sorted start'\n        case {'name': name}:\n            return name\n        case None | True | False:\n            return 'constant'\n        case _:\n            return 'other'\n\n\nasync def fetch(path: str, *, retries: int = 3) -> bytes:\n    for attempt in range(retries):\n        with open(path, 'rb') as handle:\n            data = await handle.read()\n        if data and attempt >= 0:\n            break\n    else:\n        data = b''\n    assert isinstance(data, bytes), 'must be bytes'\n    yield data\n    del data\n\n\ncounts = {key: len(key) for key in ('a', 'bb', 'ccc') if key != 'z'}\nsquares = [i ** 2 for i in range(10) if i % 2 == 0]\nmatrix = [[1, 2], [3, 4]][0][1]\ntotal = os.path.join('a', 'b').replace('\\\\', '/').upper().lower()\nflag = not (True and False) or None is None\nshift = 1 << 4 | 0b1010 & 0o17 ^ ~7\nglobal_name = __name__ == '__main__'\nbad = 5 $ 3\nnested = (plop := (3 * 5)) + f(g(h([1, {2: (3, 4)}])))\nhere = Path(os.getcwd()) / np_name\nPATTERN = re.compile(r'^(?P<name>[A-Za-z_]\\w*)\\s*(\\((\\d{2,4}|x)\\))?$')\nswapped = re.sub(r'(\\d+)-(\\d+)', r'\\2-\\1', 'ab 12-34')\nfound = re.match('[a-z]+(\\d)', 'abc7')\n\nREPORT = f'{NAME!r:>10} has {len(NAME):>5} chars, {RATIO:.2e}, {total + 1:{WIDTH}.{PREC}f} {{literal}}'\nOLDSTYLE = 'value %s of %d: %-8.3f %(key)s 100%%' % (NAME, 3, RATIO)\nTEMPLATE = 'item {0:>4} {name!r} {} {:08.3f}'.format(1, name='x')\n\n\f\n# ---- real code: marked.py ----\n\nr\"\"\"marked.py -- Markdown to HTML. One public function.\n\n    from marked import md2htm\n    htm = md2htm(md)        # md: bytes of Markdown (or a str); htm: a new bytearray of HTML\n\nmd2htm(md) -> bytearray\n    md      bytes, bytearray or memoryview of UTF-8 Markdown, or a str. Input that is not\n            UTF-8 is repaired (the bad bytes become a replacement character).\n    The HTML holds <p>, <h1>-<h6>, <pre><code>, <hr>, <blockquote>, <ul>, <ol>, <li> and\n    <table class=\"grid\">, inline emphasis, strong, ~~strike~~, `code`, [links](url \"title\"),\n    ![images](src), <autolinks>, bare http:// and www. addresses, [reference][links], hard\n    breaks. Raw HTML in the Markdown is shown as text (escaped); javascript: links are dropped.\n    The language and the markers for sections, tabs and other divs are in marker.md.\n\nThe HTML always starts with a section comment, <!--SECTION name-->: the first section is , 'name': name, 'cls': cls}\n\n\ncdef object cells(line):\n    s = line.strip()\n    if s.startswith('|'):\n        s = s[1:]\n    if s.endswith('|') and not s.endswith('\\\\|'):\n        s = s[:-1]\n    return [p.strip().replace('\\\\|', '|') for p in re.split(r'(?<!\\\\)\\|', s)]\n\n\ncdef object istable(lines, i, n):\n    if i + 1 >= n or '|' not in lines[i]:\n        return False\n    nxt = lines[i + 1]\n    return bool(DELIM.match(nxt) and ('|' in nxt or ':' in nxt)\n                and len(cells(lines[i])) == len(cells(nxt)))\n\n\ncdef object lex(lines, defs, top=False):\n    \"\"\"Blocks of a list of lines: tokens {t, first, last, ...}, first/last as indexes of\n    the lines (last excluded). Link definitions go into defs. top: the lines are the\n    document's own, so markers count (and the items of a flex).\"\"\"\n    out = []\n    i, n = 0, len(lines)\n    flex = False                                    # inside a flex: lines with | are items\n    while i < n:\n        line = lines[i]\n        if not line.strip():\n            i += 1\n            continue\n        if top:\n            mark = marker(line)\n            if mark is not None:\n                mark.update(t='mark', first=i, last=i + 1)\n                out.append(mark)\n                flex = mark['kind'] == 'open' and mark['type'] == 'flex'\n                i += 1\n                continue\n            m = ITEM.match(line) if flex else None\n            if m:\n                j = i + 1\n                body = [m.group(1)]\n                while (j < n and lines[j].strip() and not ITEM.match(lines[j])\n                       and marker(lines[j]) is None):\n                    body.append(lines[j])\n                    j += 1\n                out.append({'t': 'item', 'first': i, 'last': j, 'tokens': lex(body, defs)})\n                i = j\n                continue\n        m = FENCE.match(line)\n        if m and not (m.group(2)[0] == '`' and '`' in m.group(3)):\n            ch, size, pad = m.group(2)[0], len(m.group(2)), len(m.group(1))\n            close = re.compile(r'^ {0,3}' + re.escape(ch) + '{' + str(size) + r',}[ \\t]*$')\n            j = i + 1\n            body = []\n            while j < n and not close.match(lines[j]):\n                body.append(lines[j][min(pad, indent(lines[j])):])\n                j += 1\n            out.append({'t': 'code', 'first': i, 'last': min(j + 1, n),\n                        'lang': m.group(3).strip().split(' ')[0], 'text': '\\n'.join(body)})\n            i = min(j + 1, n)\n            continue\n        if indent(line) >= 4:\n            j = i\n            body = []\n            while j < n and (indent(lines[j]) >= 4 or not lines[j].strip()):\n                body.append(lines[j][4:])\n                j += 1\n            while body and not body[-1].strip():\n                body.pop()\n                j -= 1\n            out.append({'t': 'code', 'first': i, 'last': j, 'lang': '', 'text': '\\n'.join(body)})\n            i = j\n            continue\n        m = ATX.match(line)\n        if m:\n            text = m.group(2) or ''\n            text = '' if re.fullmatch(r'#+', text) else re.sub(r'[ \\t]+#+$', '', text)\n            out.append({'t': 'h', 'first': i, 'last': i + 1, 'depth': len(m.group(1)),\n                        'text': text.strip()})\n            i += 1\n            continue\n        if HR.match(line):\n            out.append({'t': 'hr', 'first': i, 'last': i + 1})\n            i += 1\n            continue\n        if QUOTE.match(line):\n            j = i\n            inner = []\n            while j < n:\n                q = QUOTE.match(lines[j])\n                if q:\n                    inner.append(q.group(1))\n                elif (lines[j].strip() and inner and inner[-1].strip()\n                      and not startsblock(lines[j])):\n                    inner.append(lines[j])\n                else:\n                    break\n                j += 1\n            out.append({'t': 'quote', 'first': i, 'last': j, 'tokens': lex(inner, defs)})\n            i = j\n            continue\n        m = LIST.match(line)\n        if m and not HR.match(line):\n            token, i = lexlist(lines, i, n, defs)\n            out.append(token)\n            continue\n        m = DEFINITION.match(line)\n        if m:\n            defs.setdefault(m.group(1).strip().lower(), (m.group(2), m.group(3) or ''))\n            i += 1\n            continue\n        if istable(lines, i, n):\n            align = []\n            for c in cells(lines[i + 1]):\n                align.append('center' if c.startswith(':') and c.endswith(':') else\n                             'right' if c.endswith(':') else 'left' if c.startswith(':') else '')\n            head = cells(line)\n            body = []\n            rowcls = []\n            j = i + 2\n            while j < n and lines[j].strip() and not startsblock(lines[j]):\n                row = cells(lines[j])[:len(head)]\n                row += [''] * (len(head) - len(row))\n                found = ROWCLASS.match(row[0])      # {.bad} first in the row: a class of the row\n                rowcls.append(found.group(1) if found else '')\n                if found:\n                    row[0] = row[0][found.end():]\n                body.append(row)\n                j += 1\n            out.append({'t': 'table', 'first': i, 'last': j, 'head': head,\n                        'align': align, 'rows': body, 'rowcls': rowcls})\n            i = j\n            continue\n        j = i + 1                                   # a paragraph, or a setext heading\n        depth = 0\n        while j < n and lines[j].strip():\n            s = SETEXT.match(lines[j])\n            if s:\n                depth = 1 if s.group(1)[0] == '=' else 2\n                break\n            if startsblock(lines[j]) or istable(lines, j, n):\n                break\n            j += 1\n        text = '\\n'.join(x.lstrip() for x in lines[i:j]).rstrip()   # two trailing spaces break\n        if depth:\n            out.append({'t': 'h', 'first': i, 'last': j + 1, 'depth': depth, 'text': text})\n            i = j + 1\n        else:\n            out.append({'t': 'p', 'first': i, 'last': j, 'text': text})\n            i = j\n    return out\n\n\ncdef object lexlist(lines, i, n, defs):\n    \"\"\"One list from line i: (token, the line after it).\"\"\"\n    m = LIST.match(lines[i])\n    ordered = m.group(2)[0].isdigit()\n    delim = m.group(2)[-1] if ordered else m.group(2)\n    start = int(m.group(2)[:-1]) if ordered else 0\n    items = []\n    loose = False\n    j = i\n    while j < n:\n        m = LIST.match(lines[j])\n        if not m or HR.match(lines[j]):\n            break\n        mark = m.group(2)\n        if mark[0].isdigit() != ordered or (mark[-1] if ordered else mark) != delim:\n            break\n        pad = len(m.group(1)) + len(mark)\n        spaces = len(m.group(3))\n        rest = m.group(4)\n        if not rest.strip():\n            width, first = pad + 1, ''\n        elif spaces > 4:\n            width, first = pad + 1, ' ' * (spaces - 1) + rest\n        else:\n            width, first = pad + spaces, rest\n        body = [first]\n        k = j + 1\n        while k < n:\n            line = lines[k]\n            if not line.strip():\n                look = k + 1\n                while look < n and not lines[look].strip():\n                    look += 1\n                if look < n and indent(lines[look]) >= width and body[0].strip():\n                    body += [''] * (look - k)\n                    k = look\n                    continue\n                break\n            if indent(line) >= width:\n                body.append(line[width:])\n            elif body[-1].strip() and not startsblock(line) and not LIST.match(line):\n                body.append(line.lstrip())\n            else:\n                break\n            k += 1\n        end = k\n        while end > j + 1 and not lines[end - 1].strip():\n            end -= 1\n        task = None\n        t = TASK.match(body[0])\n        if t:\n            task = t.group(1) != ' '\n            body[0] = body[0][t.end():]\n        tokens = lex(body, defs)\n        if any(a['last'] < b['first'] for a, b in zip(tokens, tokens[1:])):\n            loose = True\n        items.append({'first': j, 'last': end, 'tokens': tokens, 'task': task})\n        j = k\n        look = j\n        while look < n and not lines[look].strip():\n            look += 1\n        nxt = LIST.match(lines[look]) if look < n else None\n        if (not nxt or HR.match(lines[look]) or nxt.group(2)[0].isdigit() != ordered\n                or (nxt.group(2)[-1] if ordered else nxt.group(2)) != delim):\n            break                                   # the list ends; blanks after it are not a gap\n        if look > j:\n            loose = True                            # a blank line between two items\n        j = look\n    last = items[-1]['last']\n    return {'t': 'list', 'first': i, 'last': last, 'ordered': ordered, 'start': start,\n            'loose': loose, 'items': items}, last\n\n\n# ---- inline pass --------------------------------------------------------------------------\ncdef object punct(c):\n    return bool(c) and not (c.isalnum() or c.isspace())\n\n\ncdef object bracket(text, i):\n    \"\"\"Index of the ] that matches the [ at i, or -1.\"\"\"\n    depth = 0\n    n = len(text)\n    while i < n:\n        c = text[i]\n        if c == '\\\\':\n            i += 1\n        elif c == '`':\n            k = 1\n            while i + k < n and text[i + k] == '`':\n                k += 1\n            end = text.find('`' * k, i + k)\n            if end > 0:\n                i = end + k - 1\n        elif c == '[':\n            depth += 1\n        elif c == ']':\n            depth -= 1\n            if depth == 0:\n                return i\n        i += 1\n    return -1\n\n\ncdef object destination(text, i):\n    \"\"\"Parse (url \"title\") from the ( at i: (url, title, index after the )) or None.\"\"\"\n    n = len(text)\n    i += 1\n    while i < n and text[i] in ' \\n':\n        i += 1\n    if i < n and text[i] == '<':\n        end = text.find('>', i)\n        if end < 0:\n            return None\n        url, i = text[i + 1:end], end + 1\n    else:\n        depth, k = 0, i\n        while k < n and not text[k].isspace():\n            if text[k] == '\\\\':\n                k += 1\n            elif text[k] == '(':\n                depth += 1\n            elif text[k] == ')':\n                if depth == 0:\n                    break\n                depth -= 1\n            k += 1\n        url, i = text[i:k], k\n    while i < n and text[i] in ' \\n':\n        i += 1\n    title = ''\n    if i < n and text[i] in '\"\\'(':\n        close = ')' if text[i] == '(' else text[i]\n        end = text.find(close, i + 1)\n        if end < 0:\n            return None\n        title, i = text[i + 1:end], end + 1\n        while i < n and text[i] in ' \\n':\n            i += 1\n    if i < n and text[i] == ')':\n        return url, title, i + 1\n    return None";
